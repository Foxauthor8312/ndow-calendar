<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NDOW Event Calendar</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
}

header{
  background:#166534;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
}

button{
  background:white;
  color:#166534;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-auto-rows:minmax(140px,auto);
  gap:1px;
  background:#d1d5db;
}

.day-name{
  background:#e5e7eb;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.day{
  background:white;
  min-height:140px;
  padding:8px;
}

.day-number{
  font-weight:bold;
  margin-bottom:8px;
}

.event{
  padding:6px;
  border-radius:6px;
  color:white;
  font-size:12px;
  margin-bottom:5px;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  width:500px;
  border-radius:14px;
  padding:25px;
}

.close{
  float:right;
  cursor:pointer;
  font-size:22px;
}
/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}

.modal.hidden {
  display: none;
}

.modal-content {
  background: white;
  width: min(900px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 14px;
  position: relative;
  padding: 28px;
}

.modal-close {
  position: absolute;
  top: 10px;
  right: 14px;
  border: none;
  background: none;
  font-size: 28px;
  cursor: pointer;
}
/* LEGEND */

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  padding:14px 20px;
  background:white;
  border-bottom:1px solid #d1d5db;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
}

.legend-color{
  width:14px;
  height:14px;
  border-radius:4px;
  display:inline-block;
}

.hunter{
  background:#2563eb;
}

.fishing{
  background:#16a34a;
}

.wildlife{
  background:#9333ea;
}

.archery{
  background:#ea580c;
}

.bowhunter{
  background:#dc2626;
}

.boating{
  background:#0891b2;
}

.schools{
  background:#b45309;
}

.other{
  background:#64748b;
}
  
  
</style>
</head>

<body>

<header>

  <h1>NDOW Event Calendar</h1>

  <div class="controls">

    <button onclick="prevMonth()">Previous</button>

    <h2 id="monthLabel"></h2>

    <button onclick="nextMonth()">Next</button>

  </div>

</header>

  <div class="legend">

  <div class="legend-item">
    <span class="legend-color hunter"></span>
    Hunter Education
  </div>

  <div class="legend-item">
    <span class="legend-color fishing"></span>
    Fishing
  </div>

  <div class="legend-item">
    <span class="legend-color wildlife"></span>
    Wildlife
  </div>

  <div class="legend-item">
    <span class="legend-color archery"></span>
    Archery
  </div>

  <div class="legend-item">
    <span class="legend-color bowhunter"></span>
    Bowhunter
  </div>

  <div class="legend-item">
    <span class="legend-color boating"></span>
    Boating
  </div>

  <div class="legend-item">
    <span class="legend-color schools"></span>
    Schools
  </div>

  <div class="legend-item">
    <span class="legend-color other"></span>
    Other
  </div>

</div>

<div class="calendar" id="calendar"></div>

  <div id="eventModal" class="modal hidden">
  <div class="modal-content">

    <button id="closeModal" class="modal-close">
      ✕
    </button>

    <div id="modalBody">
      <div class="modal-loading">
        Loading event...
      </div>
    </div>

  </div>
</div>

<script>

const categoryColors = {
  'Hunter Education':'#2563eb',
  'Fishing':'#16a34a',
  'Wildlife':'#9333ea',
  'Archery':'#ea580c',
  'Bowhunter':'#dc2626',
  'Boating':'#0891b2',
  'Schools':'#b45309',
  'Other': '#64748b',
};

let events = [];

fetch('events.json')
  .then(res => res.json())
  .then(data => {

    events = data.map(event => {

      let formattedDate = '';

      const cleanDate =
  String(event.date || '').substring(0, 12);

const match = cleanDate.match(
  /(\w+)\s(\d+),\s(\d{4})/
);
      if(match){

        const months = {
          Jan:'01',
          Feb:'02',
          Mar:'03',
          Apr:'04',
          May:'05',
          Jun:'06',
          Jul:'07',
          Aug:'08',
          Sep:'09',
          Oct:'10',
          Nov:'11',
          Dec:'12'
        };

        const month =
          months[match[1].substring(0,3)];

        const day =
          match[2].padStart(2,'0');

        const year = match[3];

        formattedDate =
          `${year}-${month}-${day}`;
      }

      return {
        ...event,
        date: formattedDate
      };

    });

    renderCalendar();

  })
  .catch(err => {

    console.error(err);

    renderCalendar();

  });

let currentDate = new Date();

function renderCalendar(){

  const calendar =
    document.getElementById('calendar');

  calendar.innerHTML = '';

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const monthNames = [
    'January','February','March','April',
    'May','June','July','August',
    'September','October','November','December'
  ];

  document.getElementById('monthLabel').innerText =
    monthNames[month] + ' ' + year;

  const firstDay =
    new Date(year, month, 1).getDay();

  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  const dayNames = [
    'Sun','Mon','Tue','Wed',
    'Thu','Fri','Sat'
  ];

  dayNames.forEach(name => {

    const div = document.createElement('div');

    div.className = 'day-name';

    div.innerText = name;

    calendar.appendChild(div);

  });

  for(let i = 0; i < firstDay; i++){

    const empty = document.createElement('div');

    empty.className = 'day';

    calendar.appendChild(empty);

  }

  for(let day = 1; day <= daysInMonth; day++){

    const cell = document.createElement('div');

    cell.className = 'day';

    cell.innerHTML =
      `<div class="day-number">${day}</div>`;

    const dateStr =
      `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    const dayEvents = events.filter(
      e => e.date === dateStr
    );

   dayEvents.forEach(event => {

  const div = document.createElement('div');

  div.className = 'event';

  div.style.background =
    categoryColors[event.category]
    || categoryColors.Other;

  div.innerText = event.title;

  div.onclick = () => openEventModal(event.url);

  cell.appendChild(div);

});

calendar.appendChild(cell);

}

}

function nextMonth(){

  currentDate.setMonth(
    currentDate.getMonth() + 1
  );

  renderCalendar();

}

function prevMonth(){

  currentDate.setMonth(
    currentDate.getMonth() - 1
  );

  renderCalendar();

}

const modal = document.getElementById("eventModal");
const modalBody = document.getElementById("modalBody");

document.getElementById("closeModal")
  .addEventListener("click", closeModal);

function closeModal() {
  modal.classList.add("hidden");
  modal.style.display = "none";
}

async function openEventModal(eventUrl) {

 modal.classList.remove("hidden");
 modal.style.display = "flex";

  modalBody.innerHTML = `
    <div style="padding:40px;text-align:center;">
      Loading event...
    </div>
  `;

  try {

   const response = await fetch(
  'https://image-forensics-saas-1.onrender.com/api/event?url=' +
  encodeURIComponent(eventUrl)
);

    const html = await response.text();

    const parser = new DOMParser();

    const doc = parser.parseFromString(html, "text/html");

    const article =
      doc.querySelector("article") ||
      doc.querySelector("main");

    modalBody.innerHTML = `
      <div class="modal-body">
        ${article ? article.innerHTML : html}
      </div>
    `;

  } catch (err) {

    modalBody.innerHTML = `
      <div style="padding:40px;text-align:center;">
        Failed to load event.
      </div>
    `;
  }
}
  
</script>

  
</body>
</html>

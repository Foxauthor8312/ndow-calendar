name: Update Event Rosters

on:
  workflow_dispatch:

 schedule:
  - cron: '0 9,17 * * *'

jobs:

  update-rosters:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Roster Synchronization
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NDOW_EMAIL: ${{ secrets.NDOW_EMAIL }}
          NDOW_PASSWORD: ${{ secrets.NDOW_PASSWORD }}

        run: node roster-update.cjs

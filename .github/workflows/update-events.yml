name: Update NDOW Events

on:
  schedule:
    # 1:15 AM Pacific
    - cron: '15 8 * * *'

    # 10:15 AM Pacific
    - cron: '15 17 * * *'

    # 12:15 PM Pacific
    - cron: '15 19 * * *'

    # 2:15 PM Pacific
    - cron: '15 21 * * *'

    # 4:15 PM Pacific
    - cron: '15 23 * * *'
  workflow_dispatch:

concurrency:
  group: ndow-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node app.cjs

      - name: Run converter
        run: node convert-events.cjs

      - name: Create timestamp
        run: |
          echo "{\"lastUpdated\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > last-updated.json

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add events.json all-events.txt last-updated.json

          git diff --cached --quiet && exit 0

          git commit -m "Auto-update NDOW events"

          git pull --rebase --autostash origin main

          git push origin main

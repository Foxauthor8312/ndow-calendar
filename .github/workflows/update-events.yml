name: Update NDOW Events

on:
  schedule:

    # Runs nightly around 10 PM Pacific
    - cron: '23 5 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-events:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node app.cjs

      - name: Run converter
        run: node convert-events.cjs

      - name: Commit updated files
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add events.json all-events.txt

          git diff --cached --quiet || git commit -m "Auto-update NDOW events"

          git push

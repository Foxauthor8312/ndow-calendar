<!DOCTYPE html>
<html>
<head>
	 
<meta charset="UTF-8">

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<title>NDOW Instructor Event Calendar</title>

<link
  rel="icon"
  type="image/png"
  href="favicon.png"
>

<style>

/* ========================================
   START GLOBAL STYLES
======================================== */
	
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f3f4f6;
  height:100vh;
  overflow:hidden;
}

/* ========================================
   START HEADER SECTION
======================================== */
	
header{

  background:#19304B;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

  flex-wrap:wrap;

  padding:18px 20px;

  border-bottom:2px solid #F29647;

}
h1{
  margin:0;
  font-size:30px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:white;
}
	
.controls{
  display:flex;
  gap:10px;
  align-items:center;
  color:white;
}
	
.account-controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.user-display{
  color:white;
  font-size:14px;
  font-weight:600;
}
	
.login-button{
  background:
    linear-gradient(
      180deg,
      #166534,
      #14532d
    ) !important;
}
	
button{
  background:#F29647;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:4px;
  cursor:pointer;
  font-weight:600;
  transition:.2s ease;
}

.admin-layout > div:first-child button{

  background:#2F4A63 !important;

  color:white;

  padding:6px 8px;

  font-size:12px;

  font-weight:600;

  line-height:1;

  border-radius:6px;

}

.admin-layout > div:first-child button:hover{

  background:#24384B !important;

}

button:hover{
  opacity:.9;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(120px, 1fr));
  grid-template-rows: 32px;
  grid-auto-rows: min-content;
  gap: 1px;
  background: #d1d5db;
  border-top: 1px solid #d1d5db;
  overflow-x: auto;
  align-content: start;
}
 
.day-name{
  background:#e5e7eb;
  height:28px;
  min-height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:16px;
  padding:0;
  line-height:1;
}

.day{
  background:white;
  min-height:95px;
  height:auto;
  overflow:visible;
  padding:4px;
  border-right:1px solid #d1d5db;
  border-bottom:1px solid #d1d5db;
  box-sizing:border-box;
}

	.day.today{

  border:2px solid #fbbf24;

  box-shadow:
    inset 0 0 0 1px #fbbf24,
    0 0 12px rgba(251,191,36,0.35);

  background:
    linear-gradient(
      to bottom,
      rgba(251,191,36,0.12),
      white
    );

  position:relative;

}

.day.today::after{

  content:'TODAY';

  position:absolute;

  top:4px;
  right:6px;

  font-size:9px;

  font-weight:700;

  color:#f59e0b;

  letter-spacing:.08em;

}
	

.day-number{
  font-weight:bold;
  margin-bottom:8px;
  position:sticky;
  top:0;
  background:white;
  z-index:2;
}

.admin-button{
  background:#4B6B88;
  color:white;
}

.admin-button:hover{
  background:#3B5872;
}

.admin-panel button{
  background:#6B85A1;
  color:white;
  padding:6px 8px;
  font-size:12px;
  font-weight:600;
  line-height:1;
  border-radius:6px;
}

.admin-input{

  width:100%;

  height:42px;

  padding:0 12px;

  border-radius:8px;

  border:1px solid #d1d5db;

  background:white;

  color:#111827;

  font-size:14px;

  box-sizing:border-box;

}

.admin-input::placeholder{

  color:#9ca3af;

}
	
.admin-panel button:hover{
  background:#24384B;
}


#adminSidebar button{

  background:#E8EEF5 !important;

  color:#19304B !important;

  border:1px solid #C7D3DF !important;

  font-weight:600;

}

#adminSidebar button:hover{

  background:#D6E1EC !important;

}
.admin-nav-active{

  background:#19304B !important;

  color:white !important;

  border-left:4px solid #60A5FA !important;

  font-weight:700 !important;

}

.event{
  padding:2px 4px;
  border-radius:6px;
  color:white;
  font-size:10px;
  margin-bottom:2px;
  cursor:pointer;
  line-height:1.15;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
}

.modal-content{
  position:relative;
  background:#fff;

  width:86%;
  max-width:980px;

  height:auto;
  max-height:92vh;

  overflow-y:auto;

  margin:2vh auto;

  border-radius:12px;

  padding:14px 18px;

  box-sizing:border-box;
}

.close{
  float:right;
  cursor:pointer;
  font-size:22px;
}

.modal.hidden {
  display: none;
}
.hidden{
  display:none !important;
}
	
.modal-content{
  position:relative;
  background:#fff;
  width:86%;
  max-width:980px;
  max-height:82vh;
  overflow-y:auto;
  margin:3vh auto;
  border-radius:12px;
  padding:14px 18px;
  box-sizing:border-box;
}

.modal-close{
  position:absolute;
  top:14px;
  right:14px;
  width:34px;
  height:34px;
  border:none;
  border-radius:6px;
  background:#dc2626;
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s ease;
}

.modal-close:hover{
  background:#b91c1c;
}

@keyframes spin {

  from {
    transform:rotate(0deg);
  }

  to {
    transform:rotate(360deg);
  }

}

@media(max-width:768px){

  header{
    flex-direction:column;
    align-items:flex-start;
  }

  .controls,
  .account-controls{
    width:100%;
  }

  .legend{
    justify-content:flex-start;
  }

}

/* ========================================
   START LEGEND SECTION
======================================== */

.legend{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  width:100%;
  box-sizing:border-box;
  overflow-x:auto;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  border-right:1px solid #d1d5db;
  background:#eef2f7;
  white-space:nowrap;
  flex:0 0 auto;
}

.legend-item:last-child{
  border-right:none;
}

.legend-item{
  cursor:pointer;
  transition:.2s ease;
}

.legend-item:hover{
  background:#e5e7eb;
}

.legend-item.active-filter{
  background:#19304B;
  color:white;
}


.legend-color{
  width:14px;
  height:14px;
  border-radius:4px;
  display:inline-block;
}

.hunter{
  background:#84cc16;
}

.advanced-hunter{
  background:#166534;
}

.fishing{
  background:#f97316;
}

.wildlife{
  background:#9333ea;
}

.urban-wildlife{
  background:#0ea5e9;
}

.boating{
  background:#6b7280;
}

.archery{
  background:#bcc9bb;
}

.school{
  background:#b45309;
}

.volunteer{
  background:#2563eb;
}

.other{
  background:#64748b;
}  .official-link{
  display:inline-block;
  margin-top:20px;
  padding:12px 18px;
  background:#166534;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.event-instructors{

  margin-top:10px;

  font-size:14px;

  line-height:1.5;

  color:#374151;

}
	
.request-link{
  display:block;
  margin-top:16px;
  padding:14px 18px;
  background:#F29647;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:600;
  text-align:center;
  line-height:1.4;
}
  .contact-select{
  margin-top:14px;
  padding:10px;
  width:100%;
  border-radius:8px;
  border:1px solid #d1d5db;
  font-size:14px;
}

/* ========================================
   START STATUS BAR SECTION
======================================== */

.refresh-screen-btn{

  padding:6px 14px;

  border:1px solid #CBD5E1;

  border-radius:8px;

  background:#FFFFFF;

  color:#334155;

  font-size:13px;

  font-weight:600;

  cursor:pointer;

  white-space:nowrap;

}

.refresh-screen-btn:hover{

  background:#F8FAFC;

}

	
.updated-bar{
  background:#dbeafe;
  padding:10px 20px;
  color:#374151;

  display:flex;
  justify-content:space-between;
  align-items:center;

  font-weight:700;
  border-top:1px solid #c3d4ea;
  border-bottom:1px solid #c3d4ea;
}

.updated-section{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}

#currentTime{
  min-width:240px;
  width:240px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
	
.footer{

  padding:8px 10px;

  border-top:1px solid #DBE3EC;

  background:#F8FAFC;

  flex-shrink:0;

}

.footer-text{

  font-size:11px;

  color:#9CA3AF;

  line-height:1.25;

}

.footer-version{

  margin-top:4px;

  font-size:10px;

  color:#9CA3AF;

  font-weight:400;

}
	
.subtitle{
	
  color:rgba(255,255,255,0.78);
  font-size:13px;
  margin-top:6px;
  letter-spacing:1.2px;
  text-transform:uppercase;
}
.title-block{
  color:white;
}

.spinner{
  width:48px;
  height:48px;
  border:4px solid rgba(255,255,255,0.25);
  border-top:4px solid white;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{

  0%{
    transform:rotate(0deg);
  }

  100%{
    transform:rotate(360deg);
  }

}
	
/* ========================================
   LOGIN SCREEN
======================================== */

.login-screen{

  position:fixed;
  inset:0;

  background:#000;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;

  z-index:100000;

}

.login-box{

  width:100%;
  max-width:420px;

  display:flex;
  flex-direction:column;
  align-items:center;

}

/* HEADER */

.login-header{

  display:flex;
  align-items:center;
  gap:16px;

  margin-bottom:28px;

}

.site-logo{
  width:125px;
  height:auto;
  object-fit:contain;
  margin-right:16px;

  filter:
    drop-shadow(
      0 2px 8px rgba(0,0,0,.45)
    );
}

.login-header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
}

	@keyframes statePulse{

  0%{

    transform:scale(1);

    opacity:.82;

    filter:
      drop-shadow(
        0 0 0 rgba(242,150,71,0)
      );

  }

  50%{

    transform:scale(1.06);

    opacity:1;

    filter:
      drop-shadow(
        0 0 16px rgba(242,150,71,.55)
      );

  }

  100%{

    transform:scale(1);

    opacity:.82;

    filter:
      drop-shadow(
        0 0 0 rgba(242,150,71,0)
      );

  }

}

.login-title-main{

  font-size:52px;

  font-weight:800;

  letter-spacing:-2px;

  line-height:.9;

  color:white;

}

.login-title-sub{

  margin-top:2px;

  font-size:15px;

  font-weight:400;

  color:rgba(255,255,255,.72);

}

/* FORM */

.login-form{

  width:100%;

  display:flex;
  flex-direction:column;
  align-items:center;

}

.input-wrap,
.password-wrap{

  position:relative;

  width:100%;

  margin-bottom:18px;

}

.input-icon{

  position:absolute;

  left:22px;
  top:50%;

  transform:translateY(-50%);

  color:rgba(255,255,255,.92);

  font-size:20px;

  z-index:5;

}

.login-input{

  width:100% !important;

  height:52px;

  display:block;

  padding:0 58px;

  border-radius:14px;

  border:1px solid rgba(140,180,255,.28);

  background:
    linear-gradient(
      90deg,
      rgba(2,10,28,.98) 0%,
      rgba(18,46,96,.95) 18%,
      rgba(58,96,170,.90) 50%,
      rgba(18,46,96,.95) 82%,
      rgba(2,10,28,.98) 100%
    );

  color:white;

  font-size:18px;

  outline:none;

  box-sizing:border-box;

  appearance:none;

  -webkit-appearance:none;

  box-shadow:
    inset 0 0 18px rgba(255,255,255,.05),
    0 0 18px rgba(40,90,180,.10);

}

.login-input::placeholder{

  color:rgba(255,255,255,.58);

}

.toggle-password{

  position:absolute;

  right:22px;
  top:50%;

  transform:translateY(-50%);

  color:rgba(255,255,255,.92);

  font-size:22px;

  cursor:pointer;

}

/* LOGIN BUTTON */

/* LOGIN BUTTON */

.login-button{

  width:170px;

  height:52px;

  margin-top:10px;

  border:none;

  border-radius:16px;

background:
  linear-gradient(
    180deg,
    #166534,
    #14532d
  );

  color:white;

  font-size:18px;

  font-weight:500;

  cursor:pointer;

  box-shadow:
    0 0 20px rgba(40,90,180,.18);

}


/* LOGIN ERROR */

.login-error{

  margin-top:14px;

  min-height:18px;

  color:#fca5a5;

  font-size:16px;

  text-align:center;

  font-weight:400;

}

/* HELP */
.access-help{

  width:100%;
